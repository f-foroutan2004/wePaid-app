<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign Up form</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="./src/assets/css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Global Loader -->
    <div class="overlay hidden">
      <span class="loader"></span>
    </div>

    <div class="container">
      <div class="content">
        <div class="circle1"></div>
        <div class="circle2"></div>

        <form action="./dashboard.html" class="box" autocomplete="off">
          <div class="box1 step step1">
            <h3 class="title">ایجاد حساب کاربری</h3>

            <div class="form-inputs">
              <div class="name-input">
                <label for="username">
                  <i class="fas fa-user"></i>
                  نام کاربری
                </label>

                <input
                  type="text"
                  name="username"
                  id="username"
                  placeholder="فائزه فروتن"
                />

                <p class="userNameError hidden">نام وارد شده صحیح نمی باشد</p>
              </div>

              <div class="email-input">
                <label for="email">
                  <i class="fas fa-envelope"></i>
                  ایمیل
                </label>

                <input
                  type="text"
                  name="email"
                  id="email"
                  placeholder="xxxx@gmail.com"
                />

                <p class="emailError hidden">ایمیل وارد شده صحیح نمی باشد</p>
              </div>

              <div class="phone-input">
                <label for="phone">
                  <i class="fas fa-phone"></i>
                  شماره تلفن
                </label>

                <input
                  type="text"
                  name="phone"
                  id="phone"
                  maxlength="11"
                  placeholder="09*********"
                />

                <p class="phoneError hidden">شماره وارد شده صحیح نمی باشد</p>
              </div>

              <div class="password-input">
                <label for="password">
                  <i class="fas fa-lock"></i>
                  رمز عبور
                </label>

                <div class="password-wrapper">
                  <input
                    type="password"
                    name="password"
                    id="password"
                    maxlength="8"
                    placeholder="********"
                  />

                  <i class="fas fa-eye password-toggle" id="passwordToggle"></i>
                </div>

                <p class="passwordError hidden">رمز وارد شده صحیح نمی باشد</p>
              </div>
            </div>

            <div class="buttons">
              <button class="next-btn" type="button">
                <span>ادامه</span>
                <i class="fas fa-arrow-right"></i>
              </button>

              <button class="signIn-page-btn" type="button">
                <a href="./login.html">
                  <span>ورود به حساب</span>
                </a>
              </button>
            </div>
          </div>

          <div class="box1 step step2 hidden">
            <h3 class="title">ارز پایه حساب خود را انتخاب کنید</h3>
            <div class="currency_input form-inputs">
              <label for="currency">
                <i class="fas fa-coins"></i>

                ارز پایه
              </label>

              <select name="currency" id="currency"></select>

              <p class="currencyError hidden">لطفا ارز پایه را انتخاب کنید</p>
            </div>

            <div class="step_buttons">
              <!-- Register Button + Local Loader -->

              <button type="submit" class="signUp-create-btn">
                <i class="fas fa-user-plus register-icon"></i>
                <span class="register-text"> ایجاد حساب </span>
                <span class="local-loader hidden"></span>
              </button>
              <button type="button" class="prev-btn">
                <i class="fas fa-arrow-left"></i>
                قبلی
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
    <script type="module" src="./src/assets/js/session.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0/dist/js/select2.min.js"></script>
    <script>
      $(document).ready(function () {
        $("#currency").select2({
          language: {
            noResults: () => "موردی یافت نشد.",
          },
        });
      });
    </script>
    <script type="module" src="./src/assets/js/register.js"></script>
  </body>
</html>
