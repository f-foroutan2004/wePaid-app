<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dashboard</title>
    <link rel="stylesheet" href="./src/assets/css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="welcome">
        <h1>
          سلام
          <span id="headerUsername"></span>
        </h1>
        <p>خلاصه وضعیت مالی شما</p>
      </div>
      <button class="notification-btn">
        <i class="fas fa-bell"></i>
      </button>
    </header>

    <!-- Main -->
    <main class="main">
      <!-- SideBar -->
      <aside class="sidebar">
        <h2 class="logo">
          <i class="fas fa-wallet"></i>
          مدیریت هزینه
        </h2>
        <nav class="sidebar-nav">
          <a href="./dashboard.html" class="nav-link active">
            <i class="fas fa-home"></i>
            <span>داشبورد</span>
          </a>
          <a href="./transaction.html" class="nav-link">
            <i class="fas fa-exchange-alt"></i>
            <span>تراکنش‌ها</span>
          </a>
          <a href="#" class="nav-link">
            <i class="fas fa-chart-pie"></i>
            <span>بودجه‌ها</span>
          </a>
          <a href="#" class="nav-link">
            <i class="fas fa-user"></i>
            <span>پروفایل</span>
          </a>
        </nav>
      </aside>

      <!-- Transactions -->
      <section class="panel transactions">
        <div class="panel-header">
          <h3>لیست تراکنش ها</h3>
          <button class="add-btn">
            <i class="fas fa-plus"></i>
            تراکنش جدید
          </button>
        </div>

        <table>
          <thead>
            <tr>
              <th>ردیف</th>
              <th>عنوان</th>
              <th>دسته</th>
              <th>مقدار</th>
              <th>تاریخ</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="listId">1</td>
              <td>رستوران</td>
              <td>هزینه ها</td>
              <td>$25</td>
              <td>امروز</td>
            </tr>
            <tr>
              <td class="listId">2</td>
              <td>حمل و نقل</td>
              <td>هزینه ها</td>
              <td>$10</td>
              <td>دیروز</td>
            </tr>
            <tr>
              <td class="listId">3</td>
              <td>حقوق</td>
              <td>درآمد ها</td>
              <td>$1,200</td>
              <td>3 روز قبل</td>
            </tr>
          </tbody>
        </table>
      </section>

      <!-- Mobile Navigation -->
      <section class="mobile-nav">
        <nav class="mobile-navigation">
          <ul class="mobile-navigation-list">
            <li class="nav-bottom-link activeNav">
              <a href="./dashboard.html"><i class="fas fa-home"></i></a>
            </li>
            <li class="nav-bottom-link">
              <a href="./transaction.html"
                ><i class="fas fa-exchange-alt"></i
              ></a>
            </li>
            <li class="nav-bottom-link">
              <a href=""><i class="fas fa-plus"></i></a>
            </li>
            <li class="nav-bottom-link">
              <a href=""><i class="fas fa-chart-pie"></i></a>
            </li>
            <li class="nav-bottom-link">
              <a href=""><i class="fas fa-user"></i></a>
            </li>
          </ul>
        </nav>
      </section>
    </main>

    <!-- <script src="./src/assets/js/dashboard.js"></script> -->
  </body>
</html>
